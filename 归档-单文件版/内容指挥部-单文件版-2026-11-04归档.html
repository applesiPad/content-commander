<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容指挥部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   CSS Variables & Reset
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg: #ffffff;
  --soft: #f7f8fa;
  --panel: #ffffff;
  --line: #e9ebef;
  --ink: #0f1115;
  --muted: #69707d;
  --accent: #0b5fff;
  --accent-soft: rgba(11,95,255,.06);
  --accent-hover: rgba(11,95,255,.12);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-full: 9999px;
  --shadow-fine: 0 1px 2px rgba(15,17,21,.04), 0 8px 24px -12px rgba(15,17,21,.08);
  --shadow-hover: 0 4px 12px rgba(15,17,21,.08), 0 12px 32px -12px rgba(15,17,21,.12);
  --transition: cubic-bezier(.22,1,.36,1);
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
}

[data-theme="dark"] {
  --bg: #0f1115;
  --soft: #1a1d24;
  --panel: #1e2128;
  --line: #2d3139;
  --ink: #f0f1f3;
  --muted: #8b919d;
  --accent: #4d8eff;
  --accent-soft: rgba(77,142,255,.1);
  --accent-hover: rgba(77,142,255,.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.75;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  transition: background .3s, color .3s;
}
::selection { background: var(--accent); color: #fff; }

/* ═══════════════════════════════════════════════════════════════
   Layout
   ═══════════════════════════════════════════════════════════════ */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 220px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform .3s var(--transition);
}
.sidebar-header {
  padding: 20px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  width: 32px;
  height: 32px;
  background: var(--ink);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
}
.logo-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}
.sidebar-nav {
  flex: 1;
  padding: 12px 10px;
  overflow-y: auto;
}
.nav-section {
  margin-bottom: 16px;
}
.nav-section-title {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 0 8px;
  margin-bottom: 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.nav-item:hover { background: var(--soft); color: var(--ink); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}
.nav-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
}

/* Main content */
.main {
  flex: 1;
  margin-left: 220px;
  min-height: 100vh;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
[data-theme="dark"] .topbar {
  background: rgba(15,17,21,.75);
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.page-title {
  font-size: 16px;
  font-weight: 700;
}
.ip-switcher {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--soft);
  border-radius: var(--radius-full);
  font-size: 13px;
  cursor: pointer;
}
.ip-switcher:hover { background: var(--line); }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all .2s;
}
.topbar-btn:hover { background: var(--soft); color: var(--ink); }

.content {
  padding: 28px;
  max-width: 1200px;
}

/* ═══════════════════════════════════════════════════════════════
   Components
   ═══════════════════════════════════════════════════════════════ */

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all .2s;
  font-family: inherit;
}
.btn-primary {
  background: var(--ink);
  color: #fff;
}
.btn-primary:hover { background: var(--accent); }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
}
.btn-secondary:hover { border-color: var(--ink); color: var(--ink); }
.btn-accent {
  background: var(--accent);
  color: #fff;
}
.btn-accent:hover { background: var(--accent-hover); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--radius-sm);
}

/* Cards */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  transition: all .3s var(--transition);
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  border-color: #c9d2e8;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
}

/* Tags */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-family: var(--font-mono);
  background: var(--soft);
  border: 1px solid var(--line);
  color: var(--muted);
}
.tag-accent { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tag-success { background: #ecfdf5; border-color: #a7f3d0; color: #059669; }
.tag-warning { background: #fffbeb; border-color: #fde68a; color: #d97706; }
.tag-danger { background: #fef2f2; border-color: #fecaca; color: #dc2626; }

/* Forms */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .05em;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  background: var(--bg);
  transition: border-color .2s, box-shadow .2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

/* Tables */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.table th, .table td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.table th {
  background: var(--soft);
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
}
.table tr:last-child td { border-bottom: none; }
.table tr:hover td { background: var(--soft); }

/* Stats cards */
.stat-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.stat-value {
  font-size: 28px;
  font-weight: 900;
  font-family: var(--font-mono);
  letter-spacing: -.02em;
}
.stat-label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

/* Grid layouts */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* Flex utilities */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }

/* Text utilities */
.text-muted { color: var(--muted); }
.text-accent { color: var(--accent); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.font-mono { font-family: var(--font-mono); }
.font-bold { font-weight: 700; }

/* Spacing */
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }

/* ═══════════════════════════════════════════════════════════════
   Page-specific styles
   ═══════════════════════════════════════════════════════════════ */

/* Dashboard */
.dashboard-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { border-color: var(--accent); }

.schedule-timeline {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 28px;
}
.timeline-header {
  display: grid;
  grid-template-columns: 100px repeat(7, 1fr);
  gap: 1px;
  margin-bottom: 12px;
}
.timeline-cell {
  text-align: center;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--muted);
}
.timeline-row {
  display: grid;
  grid-template-columns: 100px repeat(7, 1fr);
  gap: 1px;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.timeline-account {
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
}
.timeline-slot {
  min-height: 32px;
  border-radius: 4px;
  padding: 2px;
}
.timeline-content {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* IP Cards */
.ip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.ip-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all .3s var(--transition);
}
.ip-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}
.ip-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 12px;
}
.ip-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.ip-track { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.ip-stats { display: flex; gap: 16px; font-size: 12px; }
.ip-stat-value { font-weight: 700; font-family: var(--font-mono); }

/* Hot topics */
.hot-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  transition: all .2s;
}
.hot-card:hover { border-color: var(--accent); }
.hot-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.hot-title { font-weight: 600; font-size: 14px; }
.hot-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.hot-ips { display: flex; gap: 4px; }
.hot-ip-dot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Topic pool */
.topic-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
}
.topic-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.topic-title { font-weight: 600; }
.topic-rating {
  padding: 2px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
}
.rating-s { background: #fef3c7; color: #d97706; }
.rating-a { background: #dbeafe; color: #2563eb; }
.rating-b { background: #e0e7ff; color: #4f46e5; }
.rating-c { background: var(--soft); color: var(--muted); }
.topic-scores { display: flex; gap: 12px; font-size: 12px; }
.topic-score { display: flex; align-items: center; gap: 4px; }

/* Script editor */
.script-editor {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 24px;
}
.script-fields { display: flex; flex-direction: column; gap: 16px; }
.script-field {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.script-field-label {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.script-sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Schedule */
.schedule-board {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 12px;
}
.schedule-day {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  min-height: 200px;
}
.schedule-day-header {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--muted);
  text-align: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.schedule-item {
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  margin-bottom: 8px;
  font-size: 12px;
  cursor: pointer;
}
.schedule-item:hover { background: var(--accent-hover); }

/* Data review */
.review-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.review-stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
}
.review-stat-value {
  font-size: 22px;
  font-weight: 900;
  font-family: var(--font-mono);
}
.review-stat-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

/* Quadrant chart */
.quadrant-chart {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
}
.quadrant-svg { width: 100%; height: 400px; }

/* AI Chat */
.ai-container {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  height: calc(100vh - 140px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.ai-sessions {
  background: var(--soft);
  border-right: 1px solid var(--line);
  padding: 12px;
  overflow-y: auto;
}
.ai-session {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 4px;
}
.ai-session:hover { background: var(--panel); }
.ai-session.active { background: var(--panel); font-weight: 600; }
.ai-chat {
  display: flex;
  flex-direction: column;
  background: var(--panel);
}
.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.ai-message {
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
}
.ai-message.user { flex-direction: row-reverse; }
.ai-bubble {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
}
.ai-message.user .ai-bubble {
  background: var(--accent);
  color: #fff;
}
.ai-message.assistant .ai-bubble {
  background: var(--soft);
}
.ai-input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 12px;
}
.ai-input {
  flex: 1;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-full);
  font-size: 14px;
  font-family: inherit;
}
.ai-input:focus { outline: none; border-color: var(--accent); }

/* Settings */
.settings-section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.settings-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 13px; }
.settings-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all .3s;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal {
  background: var(--panel);
  border-radius: var(--radius);
  width: 90%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px;
  transform: translateY(20px);
  transition: transform .3s var(--transition);
}
.modal-overlay.active .modal { transform: translateY(0); }
.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
}

/* Teleprompter */
.teleprompter-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 2000;
  display: none;
  flex-direction: column;
}
.teleprompter-overlay.active { display: flex; }
.teleprompter-header {
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #fff;
}
.teleprompter-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  overflow: hidden;
}
.teleprompter-text {
  font-size: 48px;
  line-height: 1.5;
  color: #fff;
  text-align: center;
  max-width: 800px;
}

/* ═══════════════════════════════════════════════════════════════
   Responsive
   ═══════════════════════════════════════════════════════════════ */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .dashboard-stats { grid-template-columns: repeat(2, 1fr); }
  .review-stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {

// ─── Data Store ───────────────────────────────────────────────
const Store = {
  data: null,
  
  init() {
    const saved = localStorage.getItem(STORAGE_KEY);

  getIP(id) {

  // ─── Account ─────────────────────────────────────────────────

  updateAccount(id, updates) {

  deleteAccount(id) {

  deleteContent(id) {

    if (idx > -1) {

      // Remove related posts

  addBenchWork(work) {

  // ─── Utilities ───────────────────────────────────────────────
  genId(prefix) {

// ─── Number Parser ────────────────────────────────────────────
function parseNumber(str) {
  if (typeof str === 'number') return str;
  if (!str) return 0;
  str = String(str).trim().replace(/,/g, '');
  
  let multiplier = 1;
  if (str.includes('万') || str.toLowerCase().includes('w')) {
    multiplier = 10000;
    str = str.replace(/[万wW]/g, '');
  } else if (str.includes('亿') || str.toLowerCase().includes('y')) {
    multiplier = 100000000;
    str = str.replace(/[亿yY]/g, '');
  } else if (str.toLowerCase().includes('k')) {
    multiplier = 1000;
    str = str.replace(/[kK]/g, '');
  }
  
  const num = parseFloat(str);
  return isNaN(num) ? 0 : num * multiplier;
}

function formatNumber(num) {
  if (num >= 10000) return (num / 10000).toFixed(1) + '万';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}

// ─── Rating Calculator ────────────────────────────────────────
function calcRating(scores) {
  const total = (scores.pain || 0) + (scores.useful || 0) + 
                (scores.debate || 0) + (scores.suspense || 0) + (scores.track || 0);
  let rating = 'C';
  if (total >= 21) rating = 'S';
  else if (total >= 17) rating = 'A';
  else if (total >= 13) rating = 'B';
  return { rating, total };
}

function calcTopicType(scores) {
  const dims = [
    { key: 'pain', val: scores.pain || 0 },
    { key: 'useful', val: scores.useful || 0 },
    { key: 'debate', val: scores.debate || 0 },
    { key: 'suspense', val: scores.suspense || 0 }
  ];
  dims.sort((a, b) => b.val - a.val);
  if (dims[0].val === dims[1].val) {
    // Tie-breaker order
    const order = ['pain', 'useful', 'debate', 'suspense'];
    for (const key of order) {
      if (scores[key] === dims[0].val) {
        return key === 'pain' ? '痛点型' : key === 'useful' ? '实用型' : key === 'debate' ? '评论型' : '完播型';
      }
    }
  }
  return dims[0].key === 'pain' ? '痛点型' : dims[0].key === 'useful' ? '收藏型' : dims[0].key === 'debate' ? '评论型' : '完播型';
}

// ─── Script Check (10 items) ──────────────────────────────────
function checkScript(script, ip, standards) {
  const results = [];
  const wpm = standards.wpm || 240;
  
  // 1. 开头有结果或冲突
  const hookPatterns = /[0-9]+[秒天年月]|真的|竟然|竟然|千万别|还在|焦虑|踩雷|不会|没时间|？/;
  results.push({
    id: 'hook',
    name: '开头有结果或冲突',
    pass: hookPatterns.test(script.hook || ''),
    tip: '前5秒需要给出结果、冲突或疑问'
  });
  
  // 2. 标题埋痛点
  const painPatterns = /还在|焦虑|踩雷|不会|没时间|为什么|怎么|总是|经常|难|痛|坑|错|后悔|\？/;
  results.push({
    id: 'titlePain',
    name: '标题埋痛点',
    pass: painPatterns.test(script.title || ''),
    tip: '标题应包含目标观众的痛点关键词'
  });
  
  // 3. 信息点 >= 3
  const infoCount = (script.body || '').split(/[。！？；\n]/).filter(s => s.trim().length > 5).length;
  results.push({
    id: 'infoPoints',
    name: '信息点 >= 3',
    pass: infoCount >= 3,
    tip: `当前约 ${infoCount} 个信息点，建议至少 3 个`
  });
  
  // 4. 时长 <= 目标
  const totalChars = (script.hook || '').length + (script.body || '').length + (script.cta || '').length;
  const duration = totalChars / wpm * 60;
  results.push({
    id: 'duration',
    name: '时长合理',
    pass: duration <= 180,
    tip: `预估 ${Math.round(duration)}秒，建议不超过3分钟`
  });
  
  // 5. 封面大字 <= 12字
  const coverChars = (script.cover || '').length;
  results.push({
    id: 'coverText',
    name: '封面大字 <= 12字',
    pass: coverChars <= 12,
    tip: `当前 ${coverChars} 字，建议精简`
  });
  
  // 6. 标签 3-5 个
  const tags = (script.tags || '').split(/[,，\s]+/).filter(t => t.trim());
  results.push({
    id: 'tagCount',
    name: '标签 3-5 个',
    pass: tags.length >= 3 && tags.length <= 5,
    tip: `当前 ${tags.length} 个，建议 3-5 个`
  });
  
  // 7. 含赛道词
  const trackWord = ip?.track || '';
  const hasTrackWord = trackWord && tags.some(t => t.includes(trackWord));
  results.push({
    id: 'trackTag',
    name: '含赛道标签',
    pass: hasTrackWord || !trackWord,
    tip: trackWord ? `建议包含赛道词「${trackWord}」` : '未设置IP赛道'
  });
  
  // 8. 中段有悬念
  const suspensePatterns = /但是|然而|不过|其实|没想到|结果|竟然|转折|关键|秘密/;
  results.push({
    id: 'midSuspense',
    name: '中段埋悬念',
    pass: suspensePatterns.test(script.body || ''),
    tip: '正文中加入转折或悬念提升完播'
  });
  
  // 9. 结尾引导互动
  const ctaPatterns = /你觉得|评论区|告诉我|你|你们|大家|赞同|反对|怎么看|留言/;
  results.push({
    id: 'cta',
    name: '结尾引导互动',
    pass: ctaPatterns.test(script.cta || ''),
    tip: '结尾引导评论提升互动率'
  });
  
  // 10. 无极限词
  const extremeWords = Store.data.settings.extremeWords || [];
  const fullText = (script.title || '') + (script.hook || '') + (script.body || '') + (script.cta || '');
  const foundExtreme = extremeWords.filter(w => fullText.includes(w));
  results.push({
    id: 'noExtreme',
    name: '无极限词',
    pass: foundExtreme.length === 0,
    tip: foundExtreme.length ? `发现：${foundExtreme.join('、')}` : '通过'
  });
  
  return {
    results,
    score: Math.round(results.filter(r => r.pass).length / results.length * 100),
    passed: results.filter(r => r.pass).length,
    total: results.length
  };
}

// ─── Quadrant Diagnosis ───────────────────────────────────────
function diagnosePost(post, standards, avgPlay) {
  const fiveSec = post.fiveSecRate;
  const favRate = post.play > 0 ? (post.favorite / post.play * 100) : 0;
  const avgRate = post.duration > 0 ? (post.avgPlay / post.duration * 100) : 0;
  const commentRate = post.play > 0 ? (post.comment / post.play * 100) : 0;
  
  const hasFiveSec = fiveSec !== null && fiveSec !== undefined;
  
  let quadrant = 'unknown';
  let color = 'gray';
  
  if (hasFiveSec) {
    const fiveOk = fiveSec >= standards.fiveSecLine;
    const favOk = favRate >= standards.favLine;
    
    if (fiveOk && favOk) { quadrant = 'hit'; color = 'green'; }
    else if (!fiveOk && favOk) { quadrant = 'goodContent'; color = 'yellow'; }
    else if (fiveOk && !favOk) { quadrant = 'goodHook'; color = 'orange'; }
    else { quadrant = 'redo'; color = 'red'; }
  } else {
    // No 5-sec data, fallback to favRate only
    if (favRate >= standards.favLine) { quadrant = 'maybeGood'; color = 'yellow'; }
    else { quadrant = 'unknown'; color = 'gray'; }
  }
  
  const conclusions = {
    hit: '爆款潜质',
    goodContent: '内容好、开头弱',
    goodHook: '开头强、干货弱',
    redo: '需要重做',
    maybeGood: '收藏达标（无5秒数据）',
    unknown: '数据不足'
  };
  
  const suggestions = [];
  if (hasFiveSec && fiveSec < standards.fiveSecLine) {
    suggestions.push('优化前5秒钩子');
  }
  if (favRate < standards.favLine) {
    suggestions.push('增加实用信息点');
  }
  if (avgRate < standards.avgLine) {
    suggestions.push('提升中段留存');
  }
  if (commentRate < standards.commentLine) {
    suggestions.push('加强互动引导');
  }
  if (avgPlay > 0 && avgPlay < avgPlay * 0.6) {
    suggestions.push('检查发布时段/标签');
  }
  
  return {
    quadrant,
    color,
    conclusion: conclusions[quadrant],
    metrics: { fiveSec, favRate, avgRate, commentRate },
    suggestions
  };
}

// ─── Auto Storyboard ──────────────────────────────────────────
function autoStoryboard(script, wpm = 240) {
  const shots = [];
  const sections = [
    { name: 'hook', text: script.hook || '' },
    { name: 'body', text: script.body || '' },
    { name: 'cta', text: script.cta || '' }
  ];
  
  let shotIndex = 0;
  const charsPerShot = Math.round(wpm / 60 * 4); // ~4 seconds per shot
  
  sections.forEach((section, sIdx) => {
    if (!section.text) return;
    
    // Hook: 1 close-up
    if (sIdx === 0 && section.text) {
      shots.push({
        id: 'shot_' + (++shotIndex),
        scene: '特写',
        visual: '面对镜头，表情专注',
        lines: section.text,
        chars: section.text.length,
        duration: Math.max(1, Math.round(section.text.length / (wpm / 60))),
        done: false
      });
      return;
    }
    
    // CTA: 1 medium shot
    if (sIdx === 2 && section.text) {
      shots.push({
        id: 'shot_' + (++shotIndex),
        scene: '近景',
        visual: '面对镜头，手势引导',
        lines: section.text,
        chars: section.text.length,
        duration: Math.max(1, Math.round(section.text.length / (wpm / 60))),
        done: false
      });
      return;
    }
    
    // Body: split by sentences, accumulate to ~28 chars
    const sentences = section.text.split(/([。！？；\n])/).filter(s => s.trim());
    let currentShot = { lines: '', chars: 0 };
    
    sentences.forEach((sentence, i) => {
      if (currentShot.chars + sentence.length > charsPerShot && currentShot.chars > 0) {
        // Finish current shot
        shots.push({
          id: 'shot_' + (++shotIndex),
          scene: shotIndex % 2 === 0 ? '近景' : '中景',
          visual: '',
          lines: currentShot.lines,
          chars: currentShot.chars,
          duration: Math.max(1, Math.round(currentShot.chars / (wpm / 60))),
          done: false
        });
        currentShot = { lines: '', chars: 0 };
      }
      currentShot.lines += sentence;
      currentShot.chars += sentence.length;
    });
    
    // Remaining
    if (currentShot.chars > 0) {
      shots.push({
        id: 'shot_' + (++shotIndex),
        scene: shotIndex % 2 === 0 ? '近景' : '中景',
        visual: '',
        lines: currentShot.lines,
        chars: currentShot.chars,
        duration: Math.max(1, Math.round(currentShot.chars / (wpm / 60))),
        done: false
      });
    }
  });
  
  return shots;
}

  // ─── Topic Pool ─────────────────────────────────────────────

    const data = Store.getFilteredData(this.currentIp);
    const topics = data.topics.sort((a, b) => {
      const ratingOrder = { S: 0, A: 1, B: 2, C: 3 };
      const ra = ratingOrder[calcRating(a.scores || {}).rating] ?? 4;
      const rb = ratingOrder[calcRating(b.scores || {}).rating] ?? 4;
      if (ra !== rb) return ra - rb;
      return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
    });
    
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">

                  <span class="tag">${topicType}</span>

  renderQuadrantChart(posts, standards) {
    const validPosts = posts.filter(p => p.fiveSecRate !== null && p.fiveSecRate !== undefined && p.play > 0);
    if (validPosts.length === 0) {
      return '<div style="text-align:center;padding:40px;color:var(--muted)">暂无足够数据绘制象限图</div>';
    }
    
    const width = 400;
    const height = 350;
    const padding = 50;
    const fiveLine = standards.fiveSecLine;
    const favLine = standards.favLine;
    
    return `
      <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto">
        <!-- Background -->
        <rect x="${padding}" y="${padding}" width="${width - padding * 2}" height="${height - padding * 2}" fill="var(--soft)" stroke="var(--line)"/>
        
        <!-- Quadrant lines -->
        <line x1="${padding + (width - padding * 2) * fiveLine / 100}" y1="${padding}" 
              x2="${padding + (width - padding * 2) * fiveLine / 100}" y2="${height - padding}" 
              stroke="var(--muted)" stroke-dasharray="4"/>
        <line x1="${padding}" y1="${height - padding - (height - padding * 2) * favLine / 5}" 
              x2="${width - padding}" y2="${height - padding - (height - padding * 2) * favLine / 5}" 
              stroke="var(--muted)" stroke-dasharray="4"/>
        
        <!-- Labels -->
        <text x="${width / 2}" y="${height - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">5秒完播率 %</text>
        <text x="15" y="${height / 2}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90, 15, ${height / 2})">收藏率 %</text>
        
        <!-- Quadrant labels -->
        <text x="${padding + 10}" y="${padding + 20}" font-size="10" fill="var(--muted)">内容好开头弱</text>
        <text x="${width - padding - 80}" y="${padding + 20}" font-size="10" fill="var(--success)">爆款潜质</text>
        <text x="${padding + 10}" y="${height - padding - 10}" font-size="10" fill="var(--muted)">需要重做</text>
        <text x="${width - padding - 80}" y="${height - padding - 10}" font-size="10" fill="var(--warning)">开头强干货弱</text>
        
        <!-- Data points -->
        ${validPosts.map(p => {
          const favRate = p.play > 0 ? (p.favorite / p.play * 100) : 0;
          const x = padding + (width - padding * 2) * (p.fiveSecRate || 0) / 100;
          const y = height - padding - (height - padding * 2) * Math.min(favRate, 5) / 5;
          const ip = Store.data.accounts.find(a => a.id === p.accountId);
          const color = ip ? Store.getIP(ip.ipId)?.color || 'var(--accent)' : 'var(--accent)';
          return `<circle cx="${x}" cy="${y}" r="5" fill="${color}" opacity="0.7"/>`;
        }).join('')}
      </svg>
    `;
  },

  // ─── Helper Methods ─────────────────────────────────────────
  escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  },
  
  escAttr(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  },
  
  formatTimeLeft(timestamp) {
    const diff = timestamp - Date.now();
    if (diff <= 0) return '已过期';
    const hours = Math.floor(diff / 3600000);
    if (hours < 1) return `${Math.floor(diff / 60000)}分钟后`;
    if (hours < 24) return `${hours}小时后`;
    return `${Math.floor(hours / 24)}天后`;
  },
  
  getPlatformName(key) {
    const plat = [...DEFAULT_PLATFORMS, ...(Store.data.settings.customPlatforms || [])].find(p => p.key === key);
    return plat?.name || key;
  },
  
  renderMarkdown(text) {
    if (!text) return '';
    return this.escHtml(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  },
  
  loadTheme() {
    const theme = Store.data.settings.theme || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  },
  
  toggleTheme() {
    const current = Store.data.settings.theme || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    Store.data.settings.theme = next;
    Store.save();
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  },

    this.showModal(`

        <textarea class="form-textarea" id="pasteData" rows="8" placeholder="从平台后台复制数据粘贴到这里&#10;格式：播放 点赞 收藏 评论&#10;例如：12000 850 320 45"></textarea>
        <div class="text-xs text-muted" style="margin-top:4px">支持格式：空格/Tab/逗号分隔，支持"1.2万"格式</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:20px">
        <button class="btn btn-primary" onclick="App.processPasteBackfill()">解析并填入</button>

  processPasteBackfill() {
    const text = document.getElementById('pasteData').value.trim();
    if (!text) { alert('请粘贴数据'); return; }
    
    // Parse numbers from text
    const numbers = text.split(/[\s,，\t]+/).filter(s => s).map(s => parseNumber(s));
    
    if (numbers.length < 4) {
      alert('数据不足，至少需要：播放 点赞 收藏 评论');
      return;
    }
    
    // Find first non-backfilled post
    const post = Store.data.posts.find(p => p.publishedAt && !p.backfilledAt);
    if (!post) {
      alert('没有待回填的记录');
      return;
    }
    
    Store.updatePost(post.id, {
      play: numbers[0] || 0,
      likes: numbers[1] || 0,
      favorite: numbers[2] || 0,
      comment: numbers[3] || 0,
      fiveSecRate: numbers[4] || null,
      duration: numbers[5] || null,
      backfilledAt: Date.now()
    });
    Store.save();
    
    alert('已填入并标记为已回填');
    this.showBackfillModal();
  },
  
  exportWeeklyReport() {
    const now = new Date();
    const weekAgo = new Date(now.getTime() - 7 * 24 * 3600 * 1000);
    
    const posts = Store.data.posts.filter(p => p.publishedAt && new Date(p.publishedAt) >= weekAgo);
    const contents = Store.data.contents.filter(c => new Date(c.createdAt) >= weekAgo);
    
    const totalPlay = posts.reduce((s, p) => s + (p.play || 0), 0);
    const totalLikes = posts.reduce((s, p) => s + (p.likes || 0), 0);
    const totalFav = posts.reduce((s, p) => s + (p.favorite || 0), 0);
    const totalComment = posts.reduce((s, p) => s + (p.comment || 0), 0);
    
    const ips = Store.data.ips;
    
    let report = `# 周报 · ${now.toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'})}\n\n`;
    report += `## 本周概览\n\n`;
    report += `- 发布数量：**${posts.length}** 条\n`;
    report += `- 新建内容：**${contents.length}** 条\n`;
    report += `- 总播放：**${formatNumber(totalPlay)}**\n`;
    report += `- 总点赞：**${formatNumber(totalLikes)}**\n`;
    report += `- 总收藏：**${formatNumber(totalFav)}**\n`;
    report += `- 总评论：**${formatNumber(totalComment)}**\n\n`;
    
    if (ips.length > 0) {
      report += `## 各IP表现\n\n`;
      ips.forEach(ip => {
        const ipAccounts = Store.getAccountsByIP(ip.id);
        const ipPosts = posts.filter(p => ipAccounts.some(a => a.id === p.accountId));
        if (ipPosts.length > 0) {
          const ipPlay = ipPosts.reduce((s, p) => s + (p.play || 0), 0);
          report += `### ${ip.avatar} ${ip.name}\n`;
          report += `- 发布：${ipPosts.length} 条\n`;
          report += `- 播放：${formatNumber(ipPlay)}\n\n`;
        }
      });
    }
    
    report += `## 发布明细\n\n`;
    report += `| 内容 | 账号 | 播放 | 点赞 | 收藏 | 评论 |\n`;
    report += `|------|------|------|------|------|------|\n`;
    posts.forEach(p => {
      const content = Store.getContent(p.contentId);
      const account = Store.data.accounts.find(a => a.id === p.accountId);
      report += `| ${content?.title || '-'} | ${account?.name || '-'} | ${p.play || 0} | ${p.likes || 0} | ${p.favorite || 0} | ${p.comment || 0} |\n`;
    });
    
    report += `\n---\n*由内容指挥部生成*\n`;
    
    // Download as markdown
    const blob = new Blob([report], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `周报-${now.toISOString().slice(0, 10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
    
    this.closeModal();
  },

  useAITemplate(templateName) {
    const input = document.getElementById('aiInput');
    if (input) {
      input.value = `请使用「${templateName}」模板帮我创作`;
    }
  },
  
  async sendAIMessage() {
    const input = document.getElementById('aiInput');
    if (!input || !input.value.trim()) return;
    
    const message = input.value.trim();
    const settings = Store.data.settings.ai;
    
    // Create chat if needed
    if (!this.currentChatId) {
      this.newChat();
    }
    
    const chats = settings.chats || [];
    const chat = chats.find(c => c.id === this.currentChatId);
    if (!chat) return;
    
    // Add user message
    chat.messages.push({ role: 'user', content: message, timestamp: Date.now() });
    
    // Update title if first message
    if (chat.messages.length === 1) {
      chat.title = message.slice(0, 20) + (message.length > 20 ? '...' : '');
    }
    
    input.value = '';
    this.renderPage('ai');
    
    // Call AI if configured
    if (settings.apiKey && settings.baseUrl) {
      try {
        const response = await fetch(settings.baseUrl + '/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${settings.apiKey}`
          },
          body: JSON.stringify({
            model: settings.model || 'gpt-4o-mini',
            messages: chat.messages.map(m => ({ role: m.role, content: m.content })),
            stream: true
          })
        });
        
        if (!response.ok) throw new Error('API request failed');
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantMessage = '';
        
        chat.messages.push({ role: 'assistant', content: '', timestamp: Date.now() });
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
          
          for (const line of lines) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            
            try {
              const parsed = JSON.parse(data);
              const delta = parsed.choices?.[0]?.delta?.content || '';
              assistantMessage += delta;
              chat.messages[chat.messages.length - 1].content = assistantMessage;
              this.renderPage('ai');
            } catch (e) {}
          }
        }
        
        Store.save();
      } catch (e) {
        chat.messages.push({ 
          role: 'assistant', 
          content: `❌ 请求失败：${e.message}\n\n请检查 AI 接口配置（设置 → AI 接口配置）`, 
          timestamp: Date.now() 
        });
        Store.save();
        this.renderPage('ai');
      }
    } else {
      // No AI configured, show prompt template
      const prompt = this.generatePromptTemplate(message);
      chat.messages.push({ 
        role: 'assistant', 
        content: `**未配置 AI 接口**\n\n以下是为你生成的提示词，可以复制到任意 AI 工具使用：\n\n---\n\n${prompt}\n\n---\n\n💡 在设置中配置 AI 接口后可直接对话`, 
        timestamp: Date.now() 
      });
      Store.save();
      this.renderPage('ai');
    }
  },
  
  generatePromptTemplate(userMessage) {
    const ip = this.currentIp ? Store.getIP(this.currentIp) : null;
    const recentContents = Store.getContentsByIP(this.currentIp).slice(0, 5);
    
    return `你是一个短视频内容创作专家。

${ip ? `当前IP信息：
- 名称：${ip.name}
- 赛道：${ip.track || '未设置'}
- 人设：${ip.persona || '未设置'}
- 目标观众：${ip.audience || '未设置'}` : ''}

${recentContents.length > 0 ? `最近的内容：
${recentContents.map(c => `- ${c.title}`).join('\n')}` : ''}

用户问题：${userMessage}

请给出专业、实用的建议。`;
  },
  
  // ─── Data Management ────────────────────────────────────────
  exportData() {
    const data = Store.export();
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `内容指挥部-备份-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
  
  importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
      if (Store.import(e.target.result)) {
        alert('导入成功');
        location.reload();
      } else {
        alert('导入失败，请检查文件格式');
      }
    };
    reader.readAsText(file);
  },
